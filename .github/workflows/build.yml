name: Zig CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    name: Build (${{ matrix.os }} - ${{ matrix.arch }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x86_64
          - os: ubuntu-latest
            arch: x86_64
            zig_target: x86_64-linux-gnu

          # Linux ARM64
          - os: ubuntu-latest
            arch: aarch64
            zig_target: aarch64-linux-gnu

          # macOS Intel
          - os: macos-15-intel   # Intel runner
            arch: x86_64
            zig_target: x86_64-macos

          # macOS Apple Silicon
          - os: macos-latest  # Apple Silicon runner
            arch: aarch64
            zig_target: aarch64-macos

          # Windows x86_64
          - os: windows-latest
            arch: x86_64
            zig_target: x86_64-windows-gnu

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      # ------------------------- # SDL2 for Linux (Ubuntu) # -------------------------
      - name: Install SDL2 (Linux)
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libsdl2-dev

      # ------------------------- # SDL2 for macOS # -------------------------
      - name: Install SDL2 (macOS)
        if: startsWith(matrix.os, 'macos')
        run: |
          brew update
          brew install sdl2

      # ------------------------- # SDL2 for Windows (MSYS2) # -------------------------
      - name: Install SDL2 (Windows)
        if: startsWith(matrix.os, 'windows')
        run: |
          choco install msys2 --no-progress
          C:\tools\msys64\usr\bin\bash -lc "pacman -Sy --noconfirm mingw-w64-x86_64-SDL2"
        shell: powershell

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2

      - name: Build
        run: zig build -Dtarget=${{ matrix.zig_target }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.os }}-${{ matrix.arch }}
          path: zig-out/bin/
