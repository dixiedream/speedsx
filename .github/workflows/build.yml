name: Zig CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  build:
    name: Build (${{ matrix.asset_id }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x86_64
          - os: ubuntu-latest
            arch: x86_64
            zig_target: x86_64-linux-gnu
            asset_id: linux-x86_64
            cross_target: false

          # Linux ARM64 (native arm64 runner)
          - os: ubuntu-24.04-arm
            arch: aarch64
            zig_target: aarch64-linux-gnu
            asset_id: linux-aarch64
            cross_target: false

          # macOS Intel
          - os: macos-15-intel
            arch: x86_64
            zig_target: x86_64-macos
            asset_id: macos-x86_64
            cross_target: false

          # macOS Apple Silicon
          - os: macos-latest
            arch: aarch64
            zig_target: aarch64-macos
            asset_id: macos-aarch64
            cross_target: false

          # Windows x86_64 (MinGW; explicit target matches MSYS2 SDL2)
          - os: windows-latest
            arch: x86_64
            zig_target: x86_64-windows-gnu
            asset_id: windows-x86_64
            cross_target: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Cache Zig
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/zig
            zig-cache
            zig-out
          key: zig-${{ runner.os }}-${{ matrix.arch }}-${{ hashFiles('**/*.zig') }}
          restore-keys: zig-${{ runner.os }}-${{ matrix.arch }}-

      - name: Install SDL2 (Linux)
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libsdl2-dev

      - name: Cache Homebrew
        if: startsWith(matrix.os, 'macos')
        uses: actions/cache@v5
        with:
          path: |
            ~/Library/Caches/Homebrew
            /usr/local/Homebrew
            /opt/homebrew
          key: brew-${{ runner.os }}-${{ hashFiles('**/build.zig') }}

      - name: Install SDL2 (macOS)
        if: startsWith(matrix.os, 'macos')
        run: brew install sdl2

      - name: Cache MSYS2
        if: startsWith(matrix.os, 'windows')
        uses: actions/cache@v5
        with:
          path: C:\tools\msys64\var\cache\pacman\pkg
          key: msys2-${{ runner.os }}-${{ hashFiles('**/build.zig') }}

      - name: Install SDL2 (Windows)
        if: startsWith(matrix.os, 'windows')
        run: |
          choco install msys2 --no-progress
          C:\tools\msys64\usr\bin\bash -lc "pacman -Sy --noconfirm mingw-w64-x86_64-SDL2 mingw-w64-x86_64-pkg-config"
        shell: powershell

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0

      - name: Build
        shell: bash
        env:
          PKG_CONFIG_PATH: ${{ matrix.cross_target && 'C:/tools/msys64/mingw64/lib/pkgconfig' || '' }}
        run: |
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            export PATH="/c/tools/msys64/mingw64/bin:/c/tools/msys64/usr/bin:$PATH"
          fi
          OPTS=()
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            OPTS+=(-Doptimize=ReleaseFast)
          fi
          TARGET_ARGS=()
          if [[ "${{ matrix.cross_target }}" == "true" ]]; then
            TARGET_ARGS=(-Dtarget=${{ matrix.zig_target }})
          fi
          zig build "${TARGET_ARGS[@]}" "${OPTS[@]}"

      - name: Package release asset (Unix)
        if: startsWith(github.ref, 'refs/tags/') && !startsWith(matrix.os, 'windows')
        shell: bash
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          mkdir -p dist
          tar -czf "dist/speedsx-${TAG}-${{ matrix.asset_id }}.tar.gz" -C zig-out/bin speedsx

      - name: Package release asset (Windows)
        if: startsWith(github.ref, 'refs/tags/') && startsWith(matrix.os, 'windows')
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF -replace 'refs/tags/', ''
          New-Item -ItemType Directory -Force -Path staging | Out-Null
          Copy-Item zig-out/bin/speedsx.exe staging/
          Copy-Item C:\tools\msys64\mingw64\bin\SDL2.dll staging/
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path staging/* -DestinationPath "dist/speedsx-${tag}-${{ matrix.asset_id }}.zip" -Force

      - name: Upload release artifact
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v6
        with:
          name: release-${{ matrix.asset_id }}
          path: dist/speedsx-*

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v6
        with:
          path: artifacts
          pattern: release-*
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
