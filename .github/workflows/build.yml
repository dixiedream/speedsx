name: Zig CI

on:
  push:
    tags: ["v*"]
  pull_request:
    branches: [develop]
  workflow_dispatch:

jobs:
  build:
    name: Build (${{ matrix.asset_id }})
    if: github.event_name == 'push' || startsWith(github.head_ref, 'feature/')
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x86_64
          - os: ubuntu-latest
            arch: x86_64
            zig_target: x86_64-linux-gnu
            asset_id: linux-x86_64
            cross_target: false

          # Linux ARM64 (native arm64 runner)
          - os: ubuntu-24.04-arm
            arch: aarch64
            zig_target: aarch64-linux-gnu
            asset_id: linux-aarch64
            cross_target: false

          # macOS Intel
          - os: macos-15-intel
            arch: x86_64
            zig_target: x86_64-macos
            asset_id: macos-x86_64
            cross_target: false

          # macOS Apple Silicon
          - os: macos-latest
            arch: aarch64
            zig_target: aarch64-macos
            asset_id: macos-aarch64
            cross_target: false

          # Windows x86_64 (MinGW; explicit target matches MSYS2 SDL2)
          - os: windows-latest
            arch: x86_64
            zig_target: x86_64-windows-gnu
            asset_id: windows-x86_64
            cross_target: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set release-like CI package id
        id: ci_pkg
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "release_like=true" >> "$GITHUB_OUTPUT"
            echo "package_id=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
            echo "artifact_kind=release" >> "$GITHUB_OUTPUT"
          elif [[ "$GITHUB_EVENT_NAME" == "pull_request" && "$GITHUB_HEAD_REF" == feature/* ]]; then
            echo "release_like=true" >> "$GITHUB_OUTPUT"
            echo "package_id=snapshot-${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"
            echo "artifact_kind=snapshot" >> "$GITHUB_OUTPUT"
          else
            echo "release_like=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Cache Zig
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/zig
            .zig-cache
          key: zig-${{ runner.os }}-${{ matrix.arch }}-${{ hashFiles('**/*.zig', 'src/bindings/**') }}
          restore-keys: zig-${{ runner.os }}-${{ matrix.arch }}-

      - name: Install SDL2 (Linux)
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libsdl2-dev patchelf

      - name: Cache Homebrew (macOS Apple Silicon)
        if: matrix.os == 'macos-latest'
        uses: actions/cache@v5
        with:
          path: |
            ~/Library/Caches/Homebrew
            /opt/homebrew
          key: brew-${{ runner.os }}-${{ matrix.arch }}-${{ hashFiles('**/build.zig') }}

      - name: Cache Homebrew (macOS Intel)
        if: matrix.os == 'macos-15-intel'
        uses: actions/cache@v5
        with:
          path: |
            ~/Library/Caches/Homebrew
            /usr/local/Homebrew
            /usr/local/Cellar
          key: brew-${{ runner.os }}-${{ matrix.arch }}-${{ hashFiles('**/build.zig') }}

      - name: Install SDL2 (macOS)
        if: startsWith(matrix.os, 'macos')
        run: brew install sdl2

      - name: Install SDL2 (Windows)
        if: startsWith(matrix.os, 'windows')
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-SDL2
            mingw-w64-x86_64-pkg-config

      - name: Configure MSYS2 environment
        if: startsWith(matrix.os, 'windows')
        shell: bash
        run: |
          MSYS2="${{ steps.msys2.outputs.msys2-location }}"
          echo "MSYS2_ROOT=$MSYS2" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_PATH=${MSYS2//\\//}/mingw64/lib/pkgconfig" >> "$GITHUB_ENV"
          if command -v cygpath >/dev/null 2>&1; then
            MSYS2_UNIX="$(cygpath -u "$MSYS2")"
          else
            drive="${MSYS2:0:1}"
            rest="${MSYS2:2}"
            rest="${rest//\\//}"
            MSYS2_UNIX="/${drive,,}${rest}"
          fi
          echo "${MSYS2_UNIX}/mingw64/bin" >> "$GITHUB_PATH"
          echo "${MSYS2_UNIX}/usr/bin" >> "$GITHUB_PATH"

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0

      - name: Clean build directories (release-like CI)
        if: steps.ci_pkg.outputs.release_like == 'true'
        shell: bash
        run: rm -rf .zig-cache zig-out

      - name: Build
        shell: bash
        run: |
          OPTS=()
          if [[ "${{ steps.ci_pkg.outputs.release_like }}" == "true" ]]; then
            OPTS+=(-Doptimize=ReleaseFast -Dstrip=true)
          fi
          TARGET_ARGS=()
          if [[ "${{ matrix.cross_target }}" == "true" ]]; then
            TARGET_ARGS=(-Dtarget=${{ matrix.zig_target }})
          fi
          zig build "${TARGET_ARGS[@]}" "${OPTS[@]}"

      - name: Run core unit tests
        shell: bash
        run: zig build test-core

      - name: Package release asset (Unix)
        if: steps.ci_pkg.outputs.release_like == 'true' && !startsWith(matrix.os, 'windows')
        shell: bash
        run: |
          PKG_ID="${{ steps.ci_pkg.outputs.package_id }}"
          STAGING="dist/staging-${{ matrix.asset_id }}"
          rm -rf "$STAGING"

          if [[ "${{ runner.os }}" == "macOS" ]]; then
            set -x
            run_with_timeout() {
              timeout 300 "$@" || { echo "Timed out or failed: $*" >&2; exit 1; }
            }
            KEYCHAIN="$RUNNER_TEMP/build.keychain"
            security create-keychain -p "" "$KEYCHAIN"
            security set-keychain-settings -lut 3600 "$KEYCHAIN"
            security unlock-keychain -p "" "$KEYCHAIN"
            security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
            export CODESIGN_KEYCHAIN="$KEYCHAIN"
            run_with_timeout ./scripts/bundle-sdl.sh zig-out/bin/speedsx "$STAGING"
            run_with_timeout "$STAGING/speedsx" --version
            mkdir -p dist
            run_with_timeout tar -czf "dist/speedsx-${PKG_ID}-${{ matrix.asset_id }}.tar.gz" -C "$STAGING" .
          else
            ./scripts/bundle-sdl.sh zig-out/bin/speedsx "$STAGING"
            mkdir -p dist
            tar -czf "dist/speedsx-${PKG_ID}-${{ matrix.asset_id }}.tar.gz" -C "$STAGING" .
          fi

      - name: Package release asset (Windows)
        if: steps.ci_pkg.outputs.release_like == 'true' && startsWith(matrix.os, 'windows')
        shell: pwsh
        run: |
          $pkgId = "${{ steps.ci_pkg.outputs.package_id }}"
          New-Item -ItemType Directory -Force -Path staging | Out-Null
          Copy-Item zig-out/bin/speedsx.exe staging/
          Copy-Item "$env:MSYS2_ROOT\mingw64\bin\SDL2.dll" staging/
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path staging/* -DestinationPath "dist/speedsx-${pkgId}-${{ matrix.asset_id }}.zip" -Force

      - name: Upload release artifact
        if: steps.ci_pkg.outputs.release_like == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.ci_pkg.outputs.artifact_kind }}-${{ matrix.asset_id }}
          path: dist/speedsx-*

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v6
        with:
          path: artifacts
          pattern: release-*
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
