name: Zig CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    name: Build (${{ matrix.os }} - ${{ matrix.arch }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x86_64
          - os: ubuntu-latest
            arch: x86_64
            zig_target: x86_64-linux-gnu

          # Linux ARM64
          - os: ubuntu-latest
            arch: aarch64
            zig_target: aarch64-linux-gnu

          # macOS Intel
          - os: macos-15-intel   # Intel runner
            arch: x86_64
            zig_target: x86_64-macos

          # macOS Apple Silicon
          - os: macos-latest  # Apple Silicon runner
            arch: aarch64
            zig_target: aarch64-macos

          # Windows x86_64
          - os: windows-latest
            arch: x86_64
            zig_target: x86_64-windows-gnu

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Zig
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.15.2  # or your preferred version

      - name: Build
        run: zig build -Dtarget=${{ matrix.zig_target }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}-${{ matrix.arch }}
          path: zig-out/bin/
